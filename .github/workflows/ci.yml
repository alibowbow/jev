name: Catalogue checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue and static entry points
        run: |
          npm ci
          npm test
      - name: Check JavaScript syntax
        run: |
          node --check assets/data.js
          node --check assets/app.js
